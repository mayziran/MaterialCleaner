name: build-apk

# 发布 APK 到 release 需要写仓库权限，用 YAML 显式声明，
# 不依赖仓库默认的 Actions 权限设置（默认只读会 403）。
permissions:
  contents: write

# 手动触发：Actions 页 → Run workflow → 填分支名 → 编译该分支并产出 debug APK。
# workflow 只需存在于默认分支（Actions 只识别默认分支的 workflow）；
# fork 默认分支建议设为 ci-build。
# 提 PR 走 fix/* 分支，本文件不会进入 PR/上游。
# 编译任意分支：填分支名即可，无需把代码 merge 到 main。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要编译的分支名（如 fix/emulated-statfs-sdcardfs）'
        required: true
        default: 'main'

concurrency:
  group: build-apk-${{ github.event.inputs.branch }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        # versionCode 取 git rev-list --count HEAD（根 build.gradle），必须是完整历史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.branch }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Cleaner-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to nightly pre-release
        # Actions 的 artifact 下载永远是 zip；把 apk 直接挂到 pre-release 资产可免解压下载。
        # 幂等：不存在才创建，存在则跳过，再单独 upload 覆盖资产。GITHUB_TOKEN 需有 contents:write。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view nightly --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create nightly \
              --repo "${{ github.repository }}" \
              --title "Cleaner nightly (${{ github.event.inputs.branch }})" \
              --notes "编译分支：${{ github.event.inputs.branch }} @ ${{ github.sha }}" \
              --prerelease
          gh release upload nightly \
            "app/build/outputs/apk/debug/"*.apk \
            --repo "${{ github.repository }}" \
            --clobber